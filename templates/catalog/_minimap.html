{% load i18n search_tags %}<div id="specialist-map" class="relative mt-3 h-64 w-full overflow-hidden rounded-lg border border-slate-200 bg-slate-100" role="region" aria-label="{% translate 'Адреса на карте' %}"><p data-map-status class="absolute inset-0 z-10 flex items-center justify-center px-4 text-center text-slate-600">{% translate "Загружаем карту…" %}</p></div>
{{ geojson|json_script:"specialist-geojson" }}
{% map_labels_script %}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var el = document.getElementById("specialist-map");
    var geojson = JSON.parse(document.getElementById("specialist-geojson").textContent);
    window.kamqorMap.create(el, {
      center: geojson.features[0].geometry.coordinates,
      zoom: 15,
      cooperative: true,
      geojson: geojson,
      labels: JSON.parse(document.getElementById("map-labels").textContent),
    });
  });
</script>
