{% load i18n %}{% translate "В избранное" as label_off %}{% translate "В избранном" as label_on %}{% if request.user.is_authenticated %}<form method="post" action="{% url 'favorites:toggle' profile.slug %}" hx-post="{% url 'favorites:toggle' profile.slug %}" hx-target="this" hx-swap="outerHTML" class="inline-flex">
  {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
  <button type="submit" aria-pressed="{% if active %}true{% else %}false{% endif %}" aria-label="{% if active %}{{ label_on }}{% else %}{{ label_off }}{% endif %}" class="relative z-10 inline-flex min-h-11 min-w-11 items-center justify-center rounded-full text-slate-500 hover:text-red-600 aria-pressed:text-red-600">
    <svg class="size-6" viewBox="0 0 24 24" fill="{% if active %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7.6a4.3 4.3 0 017.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>
  </button>
</form>{% else %}<a href="{% url 'accounts:login' %}?next={{ next|urlencode:'' }}" class="relative z-10 inline-flex min-h-11 min-w-11 items-center justify-center rounded-full text-slate-500 hover:text-red-600">
  <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7.6a4.3 4.3 0 017.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>
  <span class="sr-only">{{ label_off }}</span>
</a>{% endif %}
