{% load i18n l10n catalog_tags %}
<div class="relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="if (open) { open = false; $refs.btn.focus() }">
  <button type="button" data-city-button x-ref="btn" @click="open = !open" :aria-expanded="open" aria-controls="city-panel" class="inline-flex min-h-11 items-center gap-1 px-1.5 sm:px-2 lg:min-h-9 text-sm font-medium text-slate-700 hover:underline">
    <svg class="h-4 w-4 shrink-0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span>{% if SELECTED_CITY %}<span class="sr-only">{% translate "Город:" %}</span> {{ SELECTED_CITY|tr:"name" }}{% else %}{% translate "Город" %}{% endif %}</span>
    <svg class="h-4 w-4 shrink-0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <form id="city-panel" method="post" action="{% url 'core:set_city' %}" @submit="$el.querySelector('[name=next]').value = location.pathname + location.search" x-show="open" x-cloak class="absolute left-0 z-30 mt-1 w-56 rounded-lg border border-slate-200 bg-white py-1 shadow-lg">
    {% csrf_token %}
    {# The server value is the no-JS fallback; on submit it is refreshed from the address bar, which htmx (hx-push-url) changes after load. #}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" name="kato_id" value="" class="flex min-h-11 w-full items-center px-3 text-left text-sm text-slate-700 hover:bg-slate-50"{% if not SELECTED_CITY %} aria-current="true"{% endif %}>{% translate "Любой город" %}</button>
    {% for city in CITIES %}
    <button type="submit" name="kato_id" value="{{ city.id|unlocalize }}" class="flex min-h-11 w-full items-center px-3 text-left text-sm text-slate-700 hover:bg-slate-50 aria-[current=true]:font-semibold aria-[current=true]:text-primary-700"{% if city.id == SELECTED_CITY.id %} aria-current="true"{% endif %}>{{ city|tr:"name" }}</button>
    {% endfor %}
  </form>
</div>
