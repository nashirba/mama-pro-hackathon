{% load i18n static %}
<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3">
    <a href="{% url 'core:home' %}" class="flex items-center gap-2 text-lg font-bold text-teal-700">
      <img src="{% static 'img/brand/mamapro-mark.png' %}" alt="" class="h-8 w-8" width="32" height="32">
      <span>{{ BRAND_NAME }}</span>
    </a>
    <div class="flex items-center gap-4">
      {% if user.is_authenticated %}
      <form action="{% url 'accounts:logout' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="text-sm text-slate-700 hover:underline">{% translate "Выйти" %}</button>
      </form>
      <form action="{% url 'accounts:logout_all' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="text-sm text-slate-700 hover:underline">{% translate "Выйти со всех устройств" %}</button>
      </form>
      {% else %}
      <a href="{% url 'accounts:login' %}" class="text-sm text-slate-700 hover:underline">{% translate "Войти" %}</a>
      {% endif %}
      {% include "partials/language_switcher.html" %}
    </div>
  </div>
</header>
