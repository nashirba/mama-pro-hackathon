{% load i18n %}<form method="post" action="{% url 'community:like' target pk %}" hx-post="{% url 'community:like' target pk %}" hx-target="this" hx-swap="outerHTML" class="relative z-10 inline-flex">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next|default:request.get_full_path }}">
  <button type="submit" aria-pressed="{% if liked %}true{% else %}false{% endif %}" class="inline-flex min-h-11 items-center gap-1.5 rounded-lg border px-3 text-sm font-medium {% if liked %}border-primary-300 bg-primary-50 text-primary-800{% else %}border-slate-300 text-slate-700 hover:bg-slate-50{% endif %}">
    <svg class="size-4" viewBox="0 0 20 20" fill="{% if liked %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V17H4V9h3zm0 0l3-6c1.3 0 2 .9 2 2v3h4.2c.9 0 1.6.8 1.4 1.7l-1 5.4c-.2.8-.8 1.4-1.6 1.4H7"/></svg>
    {% blocktranslate with n=count %}Полезно {{ n }}{% endblocktranslate %}
  </button>
</form>
