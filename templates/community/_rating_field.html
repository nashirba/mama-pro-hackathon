{% load i18n %}<fieldset class="space-y-2">
  <legend class="text-sm font-medium">{% translate "Оценка" %}</legend>
  <div class="flex flex-wrap gap-2">
    {% for radio in form.rating %}{% if radio.data.value %}
    <label class="inline-flex min-h-11 min-w-11 cursor-pointer items-center justify-center gap-1 rounded-full border border-slate-300 px-3 text-sm font-medium has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
      <input type="radio" name="rating" value="{{ radio.data.value }}" class="sr-only"{% if radio.data.selected %} checked{% endif %}>
      <svg class="size-4 text-amber-500" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L10 14.9l-5.2 2.7 1-5.8L1.5 7.7l5.9-.9z"/></svg>{{ radio.data.value }}
    </label>
    {% endif %}{% endfor %}
  </div>
  {% if form.rating.errors %}<p class="text-sm text-red-700" role="alert">{{ form.rating.errors.0 }}</p>{% endif %}
</fieldset>
