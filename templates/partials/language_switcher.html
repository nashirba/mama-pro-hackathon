{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
{% get_available_languages as AVAILABLE_LANGUAGES %}
<form action="{% url 'set_language' %}" method="post" class="flex items-center gap-1" x-data @submit="$el.querySelector('[name=next]').value = location.pathname + location.search" aria-label="{% translate 'Язык интерфейса' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% for code, name in AVAILABLE_LANGUAGES %}
    <button type="submit" name="language" value="{{ code }}"
            class="rounded px-2 py-1 text-sm {% if code == CURRENT_LANGUAGE %}bg-teal-700 font-semibold text-white{% else %}text-slate-700 hover:bg-slate-100{% endif %}"
            {% if code == CURRENT_LANGUAGE %}aria-current="true"{% endif %}>{{ name }}</button>
  {% endfor %}
</form>
