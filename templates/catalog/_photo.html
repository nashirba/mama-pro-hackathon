{% if profile.photo %}
<img src="{{ profile.photo.url }}" alt="{{ profile.display_name }}" class="{{ size_class }} shrink-0 rounded-full object-cover">
{% else %}
<div class="{{ size_class }} flex shrink-0 items-center justify-center rounded-full bg-teal-100 text-lg font-bold text-teal-800" aria-hidden="true">{{ profile.display_name|slice:":1" }}</div>
{% endif %}
