{% load i18n %}
<nav aria-label="{% translate 'Основное меню' %}" data-bottom-nav class="fixed inset-x-0 bottom-0 z-40 border-t border-slate-200 bg-white pb-[env(safe-area-inset-bottom)] lg:hidden">
  <div class="mx-auto flex max-w-7xl">
    <a href="{% url 'core:home' %}"{% if request.resolver_match.view_name == "core:home" %} aria-current="page"{% endif %} class="flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 text-xs font-medium text-slate-600 hover:text-slate-900 aria-[current=page]:text-primary-700">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
      <span>{% translate "Главная" %}</span>
    </a>
    <a href="{% url 'community:feed' %}"{% if request.resolver_match.app_name == "community" %} aria-current="page"{% endif %} class="flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 text-xs font-medium text-slate-600 hover:text-slate-900 aria-[current=page]:text-primary-700">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a4 4 0 0 1 4 4v2"/></svg>
      <span>{% translate "Сообщество" %}</span>
    </a>
    <a href="{% url 'favorites:list' %}"{% if request.resolver_match.app_name == "favorites" %} aria-current="page"{% endif %} class="flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 text-xs font-medium text-slate-600 hover:text-slate-900 aria-[current=page]:text-primary-700">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>
      <span>{% translate "Избранное" %}</span>
    </a>
    <a href="{% url 'search:results' %}?focus=q"{% if request.resolver_match.view_name == "search:results" or request.resolver_match.view_name == "search:landing" %} aria-current="page"{% endif %} class="flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 text-xs font-medium text-slate-600 hover:text-slate-900 aria-[current=page]:text-primary-700">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>{% translate "Поиск" %}</span>
    </a>
    <a href="{% if user.is_authenticated %}{% url 'cabinet:home' %}{% else %}{% url 'accounts:login' %}?next={% url 'cabinet:home' %}{% endif %}"{% if request.resolver_match.app_name == "cabinet" %} aria-current="page"{% endif %} class="flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 text-xs font-medium text-slate-600 hover:text-slate-900 aria-[current=page]:text-primary-700">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
      <span>{% translate "Кабинет" %}</span>
    </a>
  </div>
</nav>
